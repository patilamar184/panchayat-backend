name: panchayat-backend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - panchayat_pgdata:/var/lib/postgresql/data
    ports:
      # 127.0.0.1 only, and 5433 so it never clashes with another project's PostgreSQL on 5432
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside Docker the database host is the service name "db" on the internal port 5432.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MEDIA_ROOT: /data/media
    volumes:
      - panchayat_media:/data/media
    ports:
      - "8000:8000"

volumes:
  # Fresh, project-specific volumes. These names are NOT used by any earlier project.
  panchayat_pgdata:
    name: panchayat_backend_pgdata
  panchayat_media:
    name: panchayat_backend_media
